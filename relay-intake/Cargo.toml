[package]
name = "relay-intake"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "relay-intake — structured case-record intake: PII redaction, consent gating, and next-action generation."
publish = false

[lints]
workspace = true

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
regex = "1"
tracing = "0.1"

[dev-dependencies]
serde_json = "1"
