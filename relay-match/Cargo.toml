[package]
name = "relay-match"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "relay-match — free-text need extraction and deterministic resource ranking for the relay workspace."
publish = false

[lints]
workspace = true

[dependencies]
relay-directory = { path = "../relay-directory" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "1"
tracing = "0.1"

[dev-dependencies]
tempfile = "3"
chrono = { version = "0.4", features = ["serde"] }
