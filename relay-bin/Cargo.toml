[package]
name = "relay-bin"
version = "0.4.0"
edition = "2021"
rust-version = "1.85"
license = "MIT OR Apache-2.0"
description = "relay — CLI frontend for the relay human-services workspace."
publish = false

[lints]
workspace = true

[[bin]]
name = "relay"
path = "src/main.rs"

[dependencies]
relay-directory = { path = "../relay-directory" }
relay-match = { path = "../relay-match" }
relay-letters = { path = "../relay-letters" }
relay-intake = { path = "../relay-intake" }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
thiserror = "1"
sigpipe = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }
